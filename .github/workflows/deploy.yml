# Deploys every ExpenseFlow stack to AWS from GitHub Actions, without any stored AWS access key.
#
# One-time setup (details and the exact order: docs/playbook/09-cicd.md, steps 2-3):
#   1. Deploy the ExpenseFlow-GitHubOidc stack once from your PC:
#        npx cdk deploy ExpenseFlow-GitHubOidc --exclusively -c githubRepo=<Owner>/<repo>
#   2. In GitHub (Settings > Secrets and variables > Actions; repository secrets and variables, not environment ones):
#        Secret    AWS_DEPLOY_ROLE_ARN  the stack's DeployRoleArn output (it contains your account ID)
#        Secret    AWS_DEPLOY_ROLE_ID   the stack's DeployRoleId output (masks the role's id in the log)
#        Secret    ALARM_EMAIL          optional; read 09-cicd.md step 3 first (unset when you subscribed in the console)
#        Variable  STAGE                optional; defaults to dev
#        Variable  EXTRACTION_MODEL_ID  optional; unset = AI receipt reading OFF (-c extractionModelId=none)
#        Variable  AWS_REGION           the Region of that stack and of your bootstrapped CDK environment.
#                                       Create it LAST: it switches this workflow on.
#   CI passes only these settings. Any other -c flag you use on your PC is NOT applied here.
#
# In a public repository anyone can read these logs. So: the role ARN is a secret, the account ID and the role id
# are masked, stack outputs (URLs, Cognito and API ids) are not printed, and no templates are uploaded.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Never interrupt a running CloudFormation deployment: a second run waits for the first.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The frontend build runs ~350 third-party npm packages (install scripts, build plugins). It gets no
  # id-token permission, so none of that code can ask GitHub for the token that the AWS deploy role trusts.
  build-frontend:
    runs-on: ubuntu-latest
    if: vars.AWS_REGION != ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # Only the public site files (config.json is generated later by the Frontend stack).
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy:
    needs: build-frontend
    runs-on: ubuntu-latest
    # Skipped (not failed) until you finish the one-time setup above, so pushes before then stay green.
    # Secrets cannot be used in `if:`, so the AWS_REGION variable is the switch.
    if: vars.AWS_REGION != ''
    # Only this job may ask GitHub for the OIDC token that AWS exchanges for temporary credentials.
    permissions:
      contents: read
      id-token: write
    # Do not add `environment:` to this job. It changes the OIDC `sub` claim from
    # repo:<owner>/<repo>:ref:refs/heads/main to repo:<owner>/<repo>:environment:<name>,
    # and then the role's trust policy no longer matches.
    steps:
      - name: Check deploy settings
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_DEPLOY_ROLE_ID: ${{ secrets.AWS_DEPLOY_ROLE_ID }}
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "::error::Repository secret AWS_DEPLOY_ROLE_ARN is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi
          # The credentials step prints "assumedRoleId <role id>:GitHubActions" before it masks the account ID.
          if [ -n "$AWS_DEPLOY_ROLE_ID" ]; then echo "::add-mask::$AWS_DEPLOY_ROLE_ID"; fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            infra/requirements.txt
            backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      # cdk.json runs `python app.py`, so the CDK libraries must be installed for this python.
      - run: pip install -r infra/requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
      # The CDK CLI needs no install scripts, so none run in this job.
      - name: Install the CDK CLI
        working-directory: infra
        run: npm ci --ignore-scripts
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Replaces the 12-digit account ID with *** in every later line of this job's log.
          mask-aws-account-id: true
      - name: Deploy all stacks
        working-directory: infra
        # Explicit bash runs with -o pipefail, so a failed deploy still fails the step through the filter below.
        shell: bash
        env:
          STAGE: ${{ vars.STAGE || 'dev' }}
          # Like `-c extractionModelId=none` on your PC: AI receipt reading stays OFF until the variable
          # EXTRACTION_MODEL_ID names a model (Bedrock needs the AWS Paid plan).
          EXTRACTION_MODEL_ID: ${{ vars.EXTRACTION_MODEL_ID || 'none' }}
          # A secret, so GitHub masks it in the log. Unset if you subscribed to the alarm topic in the SNS console.
          # If you deploy with -c alarmEmail on your PC instead, set it to exactly that address, but only after
          # the one-time move on your PC in 09-cicd.md step 3: removing the old subscription prints its old ID
          # (your address without punctuation, which GitHub cannot mask), and that must not happen here.
          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
        # --require-approval never: the CDK's confirmation prompt for IAM and security-group changes cannot
        # be answered in CI, and it would hang the job. Changes reach main through review instead, and the
        # role can only act through the CDK bootstrap roles (see github_oidc_stack.py).
        # The grep drops the "<Stack>.<Output> = <value>" lines (site URL, Cognito and API ids): read them in
        # CloudFormation > Stacks > Outputs instead.
        run: |
          args=(-c "stage=$STAGE" -c "extractionModelId=$EXTRACTION_MODEL_ID")
          if [ -n "$ALARM_EMAIL" ]; then args+=(-c "alarmEmail=$ALARM_EMAIL"); fi
          npx cdk deploy --all "${args[@]}" --require-approval never --no-color 2>&1 \
            | grep --line-buffered -vE '^[[:space:]]*ExpenseFlow-[A-Za-z0-9-]+\.[A-Za-z0-9]+ = '
