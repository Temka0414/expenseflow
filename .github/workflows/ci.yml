# Checks every push to main and every pull request. Nothing here needs AWS credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older, still running checks pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and scripts (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint, format check and types (backend)
        working-directory: backend
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy
      - name: Tests (backend)
        working-directory: backend
        run: pytest -q
      - name: Lint, format check and tests (helper scripts)
        run: |
          ruff check scripts
          ruff format --check scripts
          pytest -q scripts/tests

  infra:
    name: Infrastructure (CDK)
    runs-on: ubuntu-latest
    # `cdk synth` needs an account and Region to build the templates for, but not credentials.
    env:
      AWS_REGION: ap-northeast-1
      CDK_DEFAULT_ACCOUNT: "123456789012"
      CDK_DEFAULT_REGION: ap-northeast-1
      CDK_DISABLE_VERSION_CHECK: "1"
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            infra/requirements*.txt
            backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: Lint, format check and types
        run: |
          ruff check .
          ruff format --check .
          mypy app.py expenseflow_infra tests
      - name: Tests
        run: pytest -q
      # A real synth, not only the unit tests: it runs the app exactly as `cdk deploy` would, bundles the
      # Lambda layer and applies the cdk-nag rules, so any unacknowledged finding fails the build here.
      - name: Synthesize all stacks (runs cdk-nag)
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-dist"
          echo '<!doctype html><title>ExpenseFlow</title>' > "$RUNNER_TEMP/frontend-dist/index.html"
          npx cdk synth -c frontendDist="$RUNNER_TEMP/frontend-dist"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Same build the GitHub Pages demo uses, so a broken demo is caught in the pull request.
      - run: npm run build:pages
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
