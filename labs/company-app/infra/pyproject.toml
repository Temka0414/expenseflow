# Lint and test settings for the lab's CDK app: the same rules as the main infra/ app.

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["cdk.out", "node_modules"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PTH", "N", "ANN", "RUF", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # literal values in assertions are the point of a test

[tool.ruff.lint.isort]
known-first-party = ["company_app_infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
