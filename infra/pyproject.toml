# Tool configuration for the CDK app. Dependencies live in requirements*.txt (exact pins).

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["cdk.out", "node_modules"]

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle + pyflakes
  "I",            # import sorting
  "B",            # bugbear
  "UP",           # pyupgrade
  "SIM",          # simplify
  "C4",           # comprehensions
  "PTH",          # pathlib over os.path
  "N",            # pep8 naming
  "ANN",          # type annotations everywhere
  "RUF",          # ruff-specific
  "PL",           # pylint subset
]
ignore = [
  "PLR0913",  # CDK constructors legitimately take many keyword-only props
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # literal values in assertions are the point of a test

[tool.ruff.lint.isort]
known-first-party = ["expenseflow_infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
# aws-cdk-lib, constructs and cdk-nag ship inline types (py.typed); only jsii's runtime lacks stubs.
[[tool.mypy.overrides]]
module = ["jsii", "jsii.*"]
ignore_missing_imports = true
