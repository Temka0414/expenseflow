<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" role="img" aria-labelledby="t d">
  <title id="t">The 10 phases of every AWS deployment</title>
  <desc id="d">Ten boxes in two rows. Phases 1 to 4 (account, tools, identity, bootstrap) are done once per account or computer. Phases 5 to 10 (build and test, deploy, verify, operate, CI/CD, teardown) repeat for every project or change.</desc>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1e293b; }
    .box { stroke-width: 2; }
    .box.once { fill: #eef2ff; stroke: #4f46e5; }
    .box.repeat { fill: #fff7ed; stroke: #c2410c; }
    .num { font-size: 24px; font-weight: 700; }
    .num.once { fill: #4f46e5; }
    .num.repeat { fill: #c2410c; }
    .t { font-size: 17px; font-weight: 700; }
    .s { font-size: 14px; fill: #475569; }
    .head { font-size: 22px; font-weight: 700; }
    .arrow { stroke: #64748b; stroke-width: 2; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1040" height="440" fill="#ffffff"/>
  <text class="head" x="20" y="38">The 10 phases of every AWS deployment</text>
  <rect class="box once" x="20" y="70" width="180" height="120" rx="14"/>
  <text class="num once" x="110" y="100" text-anchor="middle">1</text>
  <text class="t" x="110" y="126" text-anchor="middle">Account &amp;</text>
  <text class="t" x="110" y="146" text-anchor="middle">guardrails</text>
  <text class="s" x="110" y="178" text-anchor="middle">MFA, budget, plan</text>
  <line class="arrow" x1="203" y1="130" x2="222" y2="130" marker-end="url(#head)"/>
  <rect class="box once" x="225" y="70" width="180" height="120" rx="14"/>
  <text class="num once" x="315" y="100" text-anchor="middle">2</text>
  <text class="t" x="315" y="126" text-anchor="middle">Workstation</text>
  <text class="t" x="315" y="146" text-anchor="middle">tools</text>
  <text class="s" x="315" y="178" text-anchor="middle">CLI, Node, Python</text>
  <line class="arrow" x1="408" y1="130" x2="427" y2="130" marker-end="url(#head)"/>
  <rect class="box once" x="430" y="70" width="180" height="120" rx="14"/>
  <text class="num once" x="520" y="100" text-anchor="middle">3</text>
  <text class="t" x="520" y="126" text-anchor="middle">Identity &amp;</text>
  <text class="t" x="520" y="146" text-anchor="middle">credentials</text>
  <text class="s" x="520" y="178" text-anchor="middle">admin user, profile</text>
  <line class="arrow" x1="613" y1="130" x2="632" y2="130" marker-end="url(#head)"/>
  <rect class="box once" x="635" y="70" width="180" height="120" rx="14"/>
  <text class="num once" x="725" y="100" text-anchor="middle">4</text>
  <text class="t" x="725" y="126" text-anchor="middle">IaC</text>
  <text class="t" x="725" y="146" text-anchor="middle">bootstrap</text>
  <text class="s" x="725" y="178" text-anchor="middle">cdk bootstrap</text>
  <line class="arrow" x1="818" y1="130" x2="837" y2="130" marker-end="url(#head)"/>
  <rect class="box repeat" x="840" y="70" width="180" height="120" rx="14"/>
  <text class="num repeat" x="930" y="100" text-anchor="middle">5</text>
  <text class="t" x="930" y="126" text-anchor="middle">Build &amp; test</text>
  <text class="t" x="930" y="146" text-anchor="middle">locally</text>
  <text class="s" x="930" y="178" text-anchor="middle">pytest, synth, nag</text>
  <rect class="box repeat" x="20" y="245" width="180" height="120" rx="14"/>
  <text class="num repeat" x="110" y="275" text-anchor="middle">6</text>
  <text class="t" x="110" y="311" text-anchor="middle">Deploy</text>
  <text class="s" x="110" y="353" text-anchor="middle">cdk deploy, outputs</text>
  <line class="arrow" x1="203" y1="305" x2="222" y2="305" marker-end="url(#head)"/>
  <rect class="box repeat" x="225" y="245" width="180" height="120" rx="14"/>
  <text class="num repeat" x="315" y="275" text-anchor="middle">7</text>
  <text class="t" x="315" y="311" text-anchor="middle">Verify</text>
  <text class="s" x="315" y="353" text-anchor="middle">smoke test, logs</text>
  <line class="arrow" x1="408" y1="305" x2="427" y2="305" marker-end="url(#head)"/>
  <rect class="box repeat" x="430" y="245" width="180" height="120" rx="14"/>
  <text class="num repeat" x="520" y="275" text-anchor="middle">8</text>
  <text class="t" x="520" y="311" text-anchor="middle">Operate</text>
  <text class="s" x="520" y="353" text-anchor="middle">alarms, cost</text>
  <line class="arrow" x1="613" y1="305" x2="632" y2="305" marker-end="url(#head)"/>
  <rect class="box repeat" x="635" y="245" width="180" height="120" rx="14"/>
  <text class="num repeat" x="725" y="275" text-anchor="middle">9</text>
  <text class="t" x="725" y="311" text-anchor="middle">CI/CD</text>
  <text class="s" x="725" y="353" text-anchor="middle">GitHub Actions</text>
  <line class="arrow" x1="818" y1="305" x2="837" y2="305" marker-end="url(#head)"/>
  <rect class="box repeat" x="840" y="245" width="180" height="120" rx="14"/>
  <text class="num repeat" x="930" y="275" text-anchor="middle">10</text>
  <text class="t" x="930" y="301" text-anchor="middle">Teardown</text>
  <text class="t" x="930" y="321" text-anchor="middle">&amp; prod</text>
  <text class="s" x="930" y="353" text-anchor="middle">destroy, RETAIN</text>
  <path class="arrow" d="M 930 193 V 218 H 110 V 242" fill="none" marker-end="url(#head)"/>
  <text class="s" x="520" y="212" text-anchor="middle">then, for every project and change</text>
  <rect class="box once" x="20" y="378" width="26" height="26" rx="6"/>
  <text class="s" x="58" y="397">Once per AWS account or computer</text>
  <rect class="box repeat" x="380" y="378" width="26" height="26" rx="6"/>
  <text class="s" x="418" y="397">Repeat for every project or change</text>
</svg>
