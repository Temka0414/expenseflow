<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" role="img" aria-label="Every Lambda emits JSON logs, metrics and traces; CloudWatch turns them into queries, a dashboard and alarms">
<title>Every Lambda emits JSON logs, metrics and traces; CloudWatch turns them into queries, a dashboard and alarms</title>
<style>.t{font:700 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#0f172a}.s{font:14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#334155}.m{font:14px ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace;fill:#334155}.a{font:600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#1e293b}.g{font:600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#64748b}.h{font:700 17px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#0f172a}.b{font:700 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#ffffff}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<rect width="860" height="480" fill="#ffffff"/>
<rect x="20" y="180" width="230" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="135.0" y="208" text-anchor="middle" class="t">Lambda + Powertools</text>
<text x="135.0" y="230" text-anchor="middle" class="s">Logger, Metrics, Tracer</text>
<rect x="360" y="30" width="190" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="455.0" y="58" text-anchor="middle" class="t">CloudWatch Logs</text>
<text x="455.0" y="80" text-anchor="middle" class="s">structured JSON</text>
<rect x="360" y="150" width="190" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="455.0" y="178" text-anchor="middle" class="t">X-Ray traces</text>
<text x="455.0" y="200" text-anchor="middle" class="s">one trace per request</text>
<rect x="360" y="270" width="190" height="88" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="455.0" y="298" text-anchor="middle" class="t">CloudWatch metrics</text>
<text x="455.0" y="320" text-anchor="middle" class="s">namespace ExpenseFlow</text>
<text x="455.0" y="340" text-anchor="middle" class="s">(EMF log lines)</text>
<rect x="650" y="30" width="190" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="745.0" y="58" text-anchor="middle" class="t">Logs Insights</text>
<text x="745.0" y="80" text-anchor="middle" class="s">query by request id</text>
<rect x="650" y="150" width="190" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="745.0" y="178" text-anchor="middle" class="t">Trace map</text>
<text x="745.0" y="200" text-anchor="middle" class="s">Lambda, DynamoDB, ...</text>
<rect x="650" y="280" width="190" height="68" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="745.0" y="308" text-anchor="middle" class="t">Alarms</text>
<text x="745.0" y="330" text-anchor="middle" class="s">errors, DLQs, 5xx</text>
<rect x="360" y="400" width="190" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="455.0" y="428" text-anchor="middle" class="t">Dashboard</text>
<text x="455.0" y="450" text-anchor="middle" class="s">ExpenseFlow-dev</text>
<rect x="650" y="400" width="190" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="745.0" y="428" text-anchor="middle" class="t">SNS topic</text>
<text x="745.0" y="450" text-anchor="middle" class="s">email to you</text>
