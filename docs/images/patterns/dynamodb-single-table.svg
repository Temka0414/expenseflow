<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="One DynamoDB table holds several entity types; two global secondary indexes serve the list queries">
<title>One DynamoDB table holds several entity types; two global secondary indexes serve the list queries</title>
<style>.t{font:700 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#0f172a}.s{font:14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#334155}.m{font:14px ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace;fill:#334155}.a{font:600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#1e293b}.g{font:600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#64748b}.h{font:700 17px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#0f172a}.b{font:700 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#ffffff}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<rect width="860" height="360" fill="#ffffff"/>
<rect x="20" y="30" width="368" height="148" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="204.0" y="58" text-anchor="middle" class="t">Table: PK + SK</text>
<text x="34" y="80" class="m" xml:space="preserve" style="white-space:pre">EXPENSE#&lt;id&gt;   META</text>
<text x="34" y="100" class="m" xml:space="preserve" style="white-space:pre">EXPENSE#&lt;id&gt;   HISTORY#&lt;time&gt;#STATUS#...</text>
<text x="34" y="120" class="m" xml:space="preserve" style="white-space:pre">USER#&lt;id&gt;      TOTAL#2026-10#JPY</text>
<text x="34" y="140" class="m" xml:space="preserve" style="white-space:pre">ORG            TOTAL#2026-10#JPY</text>
<text x="34" y="160" class="m" xml:space="preserve" style="white-space:pre">WSCONN#&lt;id&gt;    AUD#USER#&lt;id&gt;</text>
<rect x="20" y="245" width="330" height="88" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="185.0" y="273" text-anchor="middle" class="t">One Query on the table</text>
<text x="185.0" y="295" text-anchor="middle" class="s">PK = EXPENSE#&lt;id&gt;</text>
<text x="185.0" y="315" text-anchor="middle" class="s">returns the expense and its history</text>
<rect x="470" y="30" width="240" height="88" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="590.0" y="58" text-anchor="middle" class="t">GSI1: my expenses</text>
<text x="484" y="80" class="m" xml:space="preserve" style="white-space:pre">GSI1PK = OWNER#&lt;userId&gt;</text>
<text x="484" y="100" class="m" xml:space="preserve" style="white-space:pre">GSI1SK = &lt;createdAt&gt;#&lt;id&gt;</text>
<rect x="470" y="150" width="300" height="88" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="620.0" y="178" text-anchor="middle" class="t">GSI2: by status</text>
<text x="484" y="200" class="m" xml:space="preserve" style="white-space:pre">GSI2PK = STATUS#PENDING_APPROVAL</text>
<text x="484" y="220" class="m" xml:space="preserve" style="white-space:pre">GSI2SK = &lt;updatedAt&gt;#&lt;id&gt;</text>
<text x="470" y="275" text-anchor="start" class="s">Newest first: GSI1, ScanIndexForward=False</text>
<text x="470" y="299" text-anchor="start" class="s">Approval queue, oldest first: GSI2</text>
<text x="470" y="323" text-anchor="start" class="s">Approved in a month: GSI2 + begins_with(GSI2SK)</text>
<path d="M 388 44.0 L 429.0 44.0 L 429.0 74.0 L 470 74.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 388 114.0 L 429.0 114.0 L 429.0 194.0 L 470 194.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<rect x="388.5" y="33.0" width="40.0" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="408.5" y="49.0" text-anchor="middle" class="a">copy</text>
<rect x="409.0" y="143.0" width="40.0" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="429.0" y="159.0" text-anchor="middle" class="a">copy</text>
</svg>
