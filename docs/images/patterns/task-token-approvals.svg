<path d="M 735.0 330 L 735.0 258" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 455.0 258 L 455.0 330" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 355.0 258 L 355.0 294.0 L 120.0 294.0 L 120.0 330" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<rect x="563.8" y="53.0" width="32.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="580.0" y="69.0" text-anchor="middle" class="a">yes</text>
<rect x="434.5" y="133.0" width="25.0" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="447.0" y="149.0" text-anchor="middle" class="a">no</text>
<rect x="246.2" y="213.0" width="47.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="270.0" y="229.0" text-anchor="middle" class="a">token</text>
<rect x="548.8" y="213.0" width="62.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="580.0" y="229.0" text-anchor="middle" class="a">resumes</text>
<rect x="472.0" y="283.0" width="70.0" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="507.0" y="299.0" text-anchor="middle" class="a">decision</text>
<rect x="206.2" y="283.0" width="62.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="237.5" y="299.0" text-anchor="middle" class="a">timeout</text>
</svg>
