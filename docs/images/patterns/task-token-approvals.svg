<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-label="ApprovalWorkflow waits for a task token until a manager decides, escalates once, then expires">
<title>ApprovalWorkflow waits for a task token until a manager decides, escalates once, then expires</title>
<style>.t{font:700 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#0f172a}.s{font:14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#334155}.m{font:14px ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace;fill:#334155}.a{font:600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#1e293b}.g{font:600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#64748b}.h{font:700 17px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#0f172a}.b{font:700 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#ffffff}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<rect width="860" height="500" fill="#ffffff"/>
<rect x="20" y="30" width="190" height="88" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="115.0" y="58" text-anchor="middle" class="t">Claim + policy</text>
<text x="115.0" y="80" text-anchor="middle" class="s">ClaimExpense,</text>
<text x="115.0" y="100" text-anchor="middle" class="s">LoadPolicy</text>
<rect x="330" y="30" width="190" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="425.0" y="58" text-anchor="middle" class="t">CanAutoApprove?</text>
<text x="425.0" y="80" text-anchor="middle" class="s">Choice</text>
<rect x="640" y="30" width="190" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="735.0" y="58" text-anchor="middle" class="t">AutoApprove</text>
<text x="735.0" y="80" text-anchor="middle" class="s">small + AI-verified</text>
<rect x="330" y="190" width="190" height="68" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="425.0" y="218" text-anchor="middle" class="t">RequestApproval</text>
<text x="425.0" y="240" text-anchor="middle" class="s">waits for the token</text>
<rect x="20" y="190" width="190" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="115.0" y="218" text-anchor="middle" class="t">approval_request</text>
<text x="115.0" y="240" text-anchor="middle" class="s">stores the token</text>
<rect x="330" y="330" width="190" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="425.0" y="358" text-anchor="middle" class="t">RecordDecision</text>
<text x="425.0" y="380" text-anchor="middle" class="s">APPROVED or REJECTED</text>
<rect x="20" y="330" width="200" height="88" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="120.0" y="358" text-anchor="middle" class="t">Escalate, wait again,</text>
<text x="120.0" y="380" text-anchor="middle" class="s">then ExpireRequest</text>
<text x="120.0" y="400" text-anchor="middle" class="s">(REJECTED)</text>
<rect x="640" y="190" width="190" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="735.0" y="218" text-anchor="middle" class="t">api Lambda</text>
<text x="735.0" y="240" text-anchor="middle" class="s">SendTaskSuccess</text>
<rect x="640" y="330" width="190" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="735.0" y="358" text-anchor="middle" class="t">Manager</text>
<text x="735.0" y="380" text-anchor="middle" class="s">POST .../decision</text>
