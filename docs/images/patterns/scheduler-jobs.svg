<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" role="img" aria-label="EventBridge Scheduler runs report_generator monthly in Tokyo time; admins can start it from the API">
<title>EventBridge Scheduler runs report_generator monthly in Tokyo time; admins can start it from the API</title>
<style>.t{font:700 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#0f172a}.s{font:14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#334155}.m{font:14px ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace;fill:#334155}.a{font:600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#1e293b}.g{font:600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#64748b}.h{font:700 17px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#0f172a}.b{font:700 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#ffffff}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<rect width="860" height="370" fill="#ffffff"/>
<rect x="20" y="30" width="230" height="108" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="135.0" y="58" text-anchor="middle" class="t">EventBridge Scheduler</text>
<text x="135.0" y="80" text-anchor="middle" class="s">cron(0 9 1 * ? *)</text>
<text x="135.0" y="100" text-anchor="middle" class="s">Asia/Tokyo</text>
<text x="135.0" y="120" text-anchor="middle" class="s">2 retries, then a DLQ</text>
<rect x="20" y="240" width="190" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="115.0" y="268" text-anchor="middle" class="t">Admin API</text>
<text x="115.0" y="290" text-anchor="middle" class="s">POST /reports</text>
<rect x="320" y="120" width="210" height="108" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="425.0" y="148" text-anchor="middle" class="t">report_generator</text>
<text x="425.0" y="170" text-anchor="middle" class="s">month = previous</text>
<text x="425.0" y="190" text-anchor="middle" class="s">same input from both</text>
<text x="425.0" y="210" text-anchor="middle" class="s">callers</text>
<rect x="650" y="20" width="200" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="750.0" y="48" text-anchor="middle" class="t">DynamoDB</text>
<text x="750.0" y="70" text-anchor="middle" class="s">GSI2: approved in month</text>
<rect x="650" y="130" width="200" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="750.0" y="158" text-anchor="middle" class="t">S3 reports</text>
<text x="750.0" y="180" text-anchor="middle" class="s">reports/2026-09.csv</text>
<rect x="650" y="240" width="200" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="750.0" y="268" text-anchor="middle" class="t">Event bus</text>
<text x="750.0" y="290" text-anchor="middle" class="s">Report Generated</text>
<path d="M 250 84.0 L 285.0 84.0 L 285.0 154.0 L 320 154.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 210 274.0 L 265.0 274.0 L 265.0 204.0 L 320 204.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 530 144.0 L 590.0 144.0 L 590.0 54.0 L 650 54.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 530 164.0 L 650 164.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 530 204.0 L 590.0 204.0 L 590.0 274.0 L 650 274.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<rect x="237.5" y="218.0" width="55.0" height="42" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="265.0" y="234.0" text-anchor="middle" class="a">async</text>
<text x="265.0" y="254.0" text-anchor="middle" class="a">invoke</text>
<rect x="566.2" y="88.0" width="47.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="590.0" y="104.0" text-anchor="middle" class="a">query</text>
<rect x="558.8" y="153.0" width="62.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="590.0" y="169.0" text-anchor="middle" class="a">put CSV</text>
<rect x="558.8" y="228.0" width="62.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="590.0" y="244.0" text-anchor="middle" class="a">publish</text>
</svg>
