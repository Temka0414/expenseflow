<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="CloudFront serves the single-page app from a private S3 bucket through Origin Access Control">
<title>CloudFront serves the single-page app from a private S3 bucket through Origin Access Control</title>
<style>.t{font:700 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#0f172a}.s{font:14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#334155}.m{font:14px ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace;fill:#334155}.a{font:600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#1e293b}.g{font:600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#64748b}.h{font:700 17px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#0f172a}.b{font:700 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#ffffff}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<rect width="860" height="360" fill="#ffffff"/>
<rect x="20" y="50" width="140" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="90.0" y="78" text-anchor="middle" class="t">Browser</text>
<text x="90.0" y="100" text-anchor="middle" class="s">https only</text>
<rect x="280" y="30" width="210" height="108" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="385.0" y="58" text-anchor="middle" class="t">CloudFront</text>
<text x="385.0" y="80" text-anchor="middle" class="s">HTTP/2 + HTTP/3</text>
<text x="385.0" y="100" text-anchor="middle" class="s">gzip + brotli</text>
<text x="385.0" y="120" text-anchor="middle" class="s">security headers</text>
<rect x="640" y="40" width="200" height="108" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="740.0" y="68" text-anchor="middle" class="t">S3 site bucket</text>
<text x="740.0" y="90" text-anchor="middle" class="s">private bucket</text>
<text x="740.0" y="110" text-anchor="middle" class="s">index.html, assets/*</text>
<text x="740.0" y="130" text-anchor="middle" class="s">config.json</text>
<rect x="280" y="220" width="240" height="88" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="400.0" y="248" text-anchor="middle" class="t">Error responses</text>
<text x="400.0" y="270" text-anchor="middle" class="s">403 and 404 become</text>
<text x="400.0" y="290" text-anchor="middle" class="s">/index.html with status 200</text>
<rect x="560" y="220" width="280" height="88" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="700.0" y="248" text-anchor="middle" class="t">Cache-Control</text>
<text x="700.0" y="270" text-anchor="middle" class="s">assets/*: 1 year, immutable</text>
<text x="700.0" y="290" text-anchor="middle" class="s">index.html, config.json: no-cache</text>
<text x="20" y="330" text-anchor="start" class="s">Only this distribution may read the bucket (bucket policy on AWS:SourceArn).</text>
<path d="M 160 84.0 L 280 84.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 490 89.0 L 640 89.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 385.0 138 L 385.0 220" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<rect x="196.2" y="73.0" width="47.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="220.0" y="89.0" text-anchor="middle" class="a">HTTPS</text>
<rect x="518.8" y="68.0" width="92.5" height="42" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="565.0" y="84.0" text-anchor="middle" class="a">OAC signs</text>
<text x="565.0" y="104.0" text-anchor="middle" class="a">the request</text>
</svg>
