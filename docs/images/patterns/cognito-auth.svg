<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="Cognito sign-in: the browser gets JWTs, API Gateway verifies them, Lambda reads the claims">
<title>Cognito sign-in: the browser gets JWTs, API Gateway verifies them, Lambda reads the claims</title>
<style>.t{font:700 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#0f172a}.s{font:14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#334155}.m{font:14px ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace;fill:#334155}.a{font:600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#1e293b}.g{font:600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#64748b}.h{font:700 17px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#0f172a}.b{font:700 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#ffffff}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<rect width="860" height="380" fill="#ffffff"/>
<rect x="20" y="30" width="140" height="270" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="90.0" y="58" text-anchor="middle" class="t">Browser</text>
<text x="90.0" y="80" text-anchor="middle" class="s">React SPA</text>
<rect x="330" y="30" width="200" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="430.0" y="58" text-anchor="middle" class="t">Cognito user pool</text>
<text x="430.0" y="80" text-anchor="middle" class="s">users, groups, JWTs</text>
<rect x="650" y="30" width="210" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="755.0" y="58" text-anchor="middle" class="t">post_confirmation</text>
<text x="755.0" y="80" text-anchor="middle" class="s">adds user to employees</text>
<rect x="330" y="170" width="200" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="430.0" y="198" text-anchor="middle" class="t">HTTP API</text>
<text x="430.0" y="220" text-anchor="middle" class="s">JWT authorizer</text>
<rect x="650" y="170" width="210" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="755.0" y="198" text-anchor="middle" class="t">api Lambda</text>
<text x="755.0" y="220" text-anchor="middle" class="s">reads the claims</text>
<text x="20" y="330" text-anchor="start" class="s">The authorizer checks signature, expiry, issuer and audience before Lambda runs.</text>
<text x="20" y="354" text-anchor="start" class="s">The Lambda trusts the claims: sub, email, cognito:groups.</text>
<path d="M 160 50.0 L 330 50.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 330 80.0 L 160 80.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 530 64.0 L 650 64.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<path d="M 160 204.0 L 330 204.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<path d="M 530 204.0 L 650 204.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
<rect x="191.2" y="39.0" width="107.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="245.0" y="55.0" text-anchor="middle" class="a">sign in (SRP)</text>
<rect x="176.2" y="69.0" width="137.5" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="245.0" y="85.0" text-anchor="middle" class="a">ID + access token</text>
<rect x="558.8" y="43.0" width="62.5" height="42" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="590.0" y="59.0" text-anchor="middle" class="a">after</text>
<text x="590.0" y="79.0" text-anchor="middle" class="a">sign-up</text>
<rect x="165.0" y="179.0" width="160.0" height="42" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="245.0" y="195.0" text-anchor="middle" class="a">ID token in the</text>
<text x="245.0" y="215.0" text-anchor="middle" class="a">Authorization header</text>
<rect x="555.0" y="183.0" width="70.0" height="42" rx="4" fill="#ffffff" fill-opacity="0.94"/>
<text x="590.0" y="199.0" text-anchor="middle" class="a">verified</text>
<text x="590.0" y="219.0" text-anchor="middle" class="a">claims</text>
</svg>
