<rect x="290" y="220" width="250" height="68" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="415.0" y="248" text-anchor="middle" class="t">Access logs</text>
<text x="415.0" y="270" text-anchor="middle" class="s">one JSON line per request</text>
<rect x="660" y="220" width="190" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="755.0" y="248" text-anchor="middle" class="t">DynamoDB</text>
<text x="755.0" y="270" text-anchor="middle" class="s">conditional writes</text>
<text x="20" y="322" text-anchor="start" class="s">Unknown paths are rejected by API Gateway (404) without invoking Lambda.</text>
